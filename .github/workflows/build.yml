name: Build and release

# Every push and pull request builds and tests the Windows app.
# A push to main whose version (dragshift/__init__.py) has no release yet publishes one:
# tag vX.Y.Z, Tesler-Setup.exe, Tesler-Portable.exe and SHA256SUMS.txt, with notes from CHANGELOG.md.
# The app's updater reads that release.

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python installer/stamp_version.py
          "version=$v" >> $env:GITHUB_OUTPUT
          "Building Tesler $v"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest pytest-github-actions-annotate-failures

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q -rfE --tb=short -p no:cacheprovider 2>&1 | Tee-Object -FilePath pytest.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content pytest.txt -Tail 60) -join "%0A"
            Write-Output "::error title=pytest exit $code::$tail"
            exit $code
          }
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build app folder (for the installer)
        run: pyinstaller Tesler.spec --noconfirm

      - name: Build portable exe
        shell: pwsh
        env:
          ONEFILE: "1"
        run: |
          pyinstaller Tesler.spec --noconfirm
          Move-Item dist\Tesler.exe dist\Tesler-Portable.exe -Force

      - name: Self-test both builds
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($exe in @("dist\Tesler\Tesler.exe", "dist\Tesler-Portable.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Self-test failed for $exe ($($p.ExitCode))" }
            "Self-test passed: $exe"
          }

      - name: Build installer
        shell: pwsh
        env:
          DS_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\Tesler.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          "{0:N1} MB installer" -f ((Get-Item dist\Tesler-Setup.exe).Length / 1MB)

      - name: Test the installer (silent install, self-test, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process dist\Tesler-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=contextmenu" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed ($($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\Tesler\Tesler.exe"
          if (-not (Test-Path $app)) { throw "App not installed" }
          if (-not (Test-Path "HKCU:\Software\Classes\*\shell\Tesler\command")) { throw "Context menu not registered" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $t = Start-Process $app -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "Installed app self-test failed" }
          Remove-Item Env:QT_QPA_PLATFORM
          $u = Start-Process "$env:LOCALAPPDATA\Programs\Tesler\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "HKCU:\Software\Classes\*\shell\Tesler") { throw "Uninstall left the context menu behind" }
          "Installer OK"

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist\Tesler-Setup.exe, dist\Tesler-Portable.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tesler-windows
          path: |
            dist/Tesler-Setup.exe
            dist/Tesler-Portable.exe
            dist/SHA256SUMS.txt

  release:
    needs: windows
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.windows.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: check
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already published: nothing to do (bump the version to release)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 -c "from dragshift.updater import notes_for; print(notes_for())" > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; fi
          cat >> notes.md <<EOF

          ---
          **Instalar:** baixe **Tesler-Setup.exe** e abra (não pede administrador). Quem já tem o Tesler recebe esta versão pelo próprio app.
          **Portátil:** Tesler-Portable.exe roda sem instalar.

          Na primeira vez, o Windows pode mostrar "O Windows protegeu o computador": clique em **Mais informações → Executar assim mesmo**.

          Curtiu o Tesler? Um cafezinho via Pix ajuda a manter o projeto vivo: [veja como apoiar](https://github.com/VictorJurado18/tesler#curtiu-o-tesler). ☕
          EOF
          cat notes.md

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.exists == 'false'
        with:
          name: tesler-windows
          path: out

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Tesler ${{ env.VERSION }}
          body_path: notes.md
          make_latest: true
          files: |
            out/Tesler-Setup.exe
            out/Tesler-Portable.exe
            out/SHA256SUMS.txt
