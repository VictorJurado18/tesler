name: Record demo video

on:
  workflow_dispatch:   # manual only (inherited from DragShift; not maintained for Tesler)

permissions:
  contents: write

jobs:
  record:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyautogui pywinauto imageio-ffmpeg

      - name: Record
        run: python demo/record_demo.py

      - name: Publish recording
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-recording
          name: Demo recording (automated)
          prerelease: true
          body: Screen recording of Tesler driven automatically on a Windows machine.
          files: demo_out/*

      - name: Save recording to the demo-output branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/o && cp -r demo_out/* /tmp/o/ || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan demo-output
          git rm -rfq . || true
          cp -r /tmp/o/* . || true
          git add -A
          git commit -qm "Demo recording ${GITHUB_SHA}" || true
          git push -f origin demo-output
